[package]
name = "gerador"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gerar_lote"
path = "src/main.rs"

[dependencies]
ttf-parser = "0.24"
tiny-skia = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
image = "0.25"
resvg = "0.48.1"
usvg = "0.48.1"

[profile.release]
opt-level = 3
